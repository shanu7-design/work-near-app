const go=(tab)=>{S.tab=tab;save();render();scrollTo(0,0)};
const set=(fn)=>{fn();save();render()};
const opts=(o,sel,all,ix)=>(all!=null?`<option value="">${all}</option>`:'')+Object.keys(o).map(k=>`<option value="${k}" ${k===sel?'selected':''}>${ix==null?o[k]:o[k][0]+' '+o[k][ix]}</option>`).join('');
const payTxt=j=>'₹'+j.p.toLocaleString('en-IN')+'/'+t(j.u==='hour'?'hr':j.u).replace('hour','hr');

/* ---------- screens ---------- */
function card(j){
 const tr=S.tr[j.id],ty=TY[j.ty],ca=CA[j.cat];
 return `<article class="card" aria-label="${esc(j.t)}"><div class="r1"><span class="ic" aria-hidden="true">${ca[0]}</span>
 <div><h3>${esc(j.t)}</h3><div class="mu">${esc(j.e)} · ${esc(j.a)}${j.km?' · '+j.km+' '+t('km'):''}</div></div>${j.v?`<span class="ver">${t('ver')}</span>`:''}</div>
 <div class="tags"><span class="tag pay">${payTxt(j)}</span><span class="tag">🕐 ${esc(j.h)}</span><span class="tag">${ty[0]} ${ty[L()]}</span>
 <span class="tag">${j.d===0?t('today'):j.d+' '+t('ago')}</span>${j.s.includes('n')?'<span class="tag">✨ No experience</span>':''}${fits(j)?`<span class="tag ok">✅ ${t('fits')}</span>`:''}</div>
 <details><summary>${t('details')}</summary><p><b>${t('req')}:</b> ${esc(j.req)}</p><div class="safe">🛡️ ${t('tip')}</div></details>
 <div class="btns"><button class="p" onclick="apply(${j.id})">${t('apply')}</button><a href="tel:+91${j.ph}" aria-label="${t('call')} ${esc(j.e)}">📞 ${t('call')}</a>
 <a href="https://wa.me/91${j.ph}" target="_blank" rel="noopener" aria-label="${t('wa')}">💬 WA</a><button onclick="toggleSave(${j.id})" aria-pressed="${!!tr}">${tr?t('saved'):'🔖 '+t('save')}</button></div>
 <button class="link" onclick="reportJob(${j.id})">🚩 ${t('report')}</button></article>`}

function jobsView(){
 const f=S.f;
 let list=visible().filter(j=>j.c===S.city&&(!f.ty||j.ty===f.ty)&&(!f.cat||j.cat===f.cat)&&perDay(j)>=f.pay&&(!f.km||j.km<=f.km)&&(!f.today||(j.d===0&&j.ty==='gig')));
 if(S.student)list=list.filter(j=>j.s.includes('n')&&(!S.free.length||fits(j)));
 list.sort((a,b)=>(fits(b)-fits(a))||a.km-b.km||a.d-b.d);
 const cityOpts=Object.keys(CITIES).concat(S.cities).map(c=>`<option value="${esc(c)}" ${c===S.city?'selected':''}>${esc(cityName(c))}</option>`).join('')+`<option value="__add">+ ${t('addCity').split(' ').slice(-2).join(' ')}</option>`;
 return `<div class="top"><h1>📍 ${t('near')}</h1><select style="width:auto" aria-label="${t('city')}" onchange="setCity(this.value)">${cityOpts}</select></div>
 <div class="row"><button onclick="locate()">📍 ${t('locate')}</button><button onclick="set(()=>S.f.today=!S.f.today)" aria-pressed="${f.today}" class="${f.today?'p':''}">${t('earn')}</button></div>
 <label class="sw"><input type="checkbox" ${S.student?'checked':''} onchange="set(()=>S.student=this.checked)">🎓 ${t('student')}</label>
 ${S.student?`<div class="chips" role="group" aria-label="${t('free')}"><b style="width:100%">${t('free')}:</b>${['e','w','m'].map(k=>`<label><input type="checkbox" ${S.free.includes(k)?'checked':''} onchange="toggleFree('${k}')">${t(k)}</label>`).join('')}</div>`:''}
 <div class="row"><select aria-label="${t('type')}" onchange="set(()=>S.f.ty=this.value)">${opts(TY,f.ty,t('allT'),L())}</select>
 <select aria-label="${t('cat')}" onchange="set(()=>S.f.cat=this.value)">${opts(CA,f.cat,t('allC'),L())}</select>
 <select aria-label="Pay" onchange="set(()=>S.f.pay=+this.value)">${[0,300,500,800].map(v=>`<option value="${v}" ${v==f.pay?'selected':''}>${v?'₹'+v+'+ /day':t('anyPay')}</option>`).join('')}</select>
 <select aria-label="Distance" onchange="set(()=>S.f.km=+this.value)">${[0,3,5,10].map(v=>`<option value="${v}" ${v==f.km?'selected':''}>${v?'≤ '+v+' '+t('km'):t('anyKm')}</option>`).join('')}</select></div>
 <p class="mu">${list.length} · ${t('upd')}: ${new Date(S.updated).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})} · ${t('pg')}</p>
 ${list.map(card).join('')||`<div class="card">${t('none')}</div>`}`}

function trackerView(){
 const ids=Object.keys(S.tr).map(Number),all=loadJobs();
 const sts=['saved','applied','interview','offer','rejected'];
 return `<h1>🔖 ${t('track')}</h1>`+(ids.map(id=>{const j=all.find(x=>x.id===id);if(!j)return'';const r=S.tr[id];
 return `<div class="card"><h3>${CA[j.cat][0]} ${esc(j.t)}</h3><div class="mu">${esc(j.e)} · ${esc(cityName(j.c))} · ${payTxt(j)}</div>
 <div class="row"><select aria-label="Status" onchange="set(()=>S.tr[${id}].st=this.value)">${sts.map(s=>`<option value="${s}" ${r.st===s?'selected':''}>${t('st_'+s)}</option>`).join('')}</select>
 <label class="mu">${t('remind')}<input type="date" value="${esc(r.rem||'')}" onchange="set(()=>S.tr[${id}].rem=this.value)"></label></div>
 <div class="btns" style="grid-template-columns:1fr 1fr 1fr"><a href="tel:+91${j.ph}">📞 ${t('call')}</a><a href="https://wa.me/91${j.ph}" target="_blank" rel="noopener">💬 WA</a><button onclick="set(()=>delete S.tr[${id}])">${t('remove')}</button></div></div>`}).join('')||`<div class="card">${t('empty')}</div>`)}

function postView(){
 const cs=Object.keys(CITIES).concat(S.cities).map(c=>[c,cityName(c)]);
 return `<h1>🏪 ${t('pj')}</h1><p class="mu">No resume or registration needed.</p>
 <div id="pf"><label class="f" for="pt">${t('jt')}</label><input id="pt" required>
 <label class="f" for="pe">${t('emp')}</label><input id="pe">
 <label class="f" for="pp">${t('ph')}</label><input id="pp" type="tel" inputmode="numeric" maxlength="10" placeholder="9xxxxxxxxx">
 <div class="row"><div><label class="f" for="pc">${t('city')}</label><select id="pc">${cs.map(c=>`<option value="${esc(c[0])}" ${c[0]===S.city?'selected':''}>${esc(c[1])}</option>`).join('')}</select></div>
 <div><label class="f" for="pa">${t('area')}</label><input id="pa"></div></div>
 <div class="row"><div><label class="f" for="pk">${t('cat')}</label><select id="pk">${opts(CA,'',null,L())}</select></div>
 <div><label class="f" for="py">${t('type')}</label><select id="py">${opts(TY,'',null,L())}</select></div></div>
 <div class="row"><div><label class="f" for="pm">${t('pay')}</label><input id="pm" type="number" inputmode="numeric" min="0"></div>
 <div><label class="f" for="pu">${t('unit')}</label><select id="pu"><option value="hour">${t('hr')}</option><option value="day">${t('day')}</option><option value="month">${t('month')}</option></select></div></div>
 <label class="f" for="ph">${t('hours')}</label><input id="ph"><label class="f" for="pr">${t('rq')}</label><textarea id="pr" rows="2"></textarea>
 <label class="sw" style="margin-top:10px"><input type="checkbox" id="pn">✨ No experience needed</label>
 <button class="p" style="width:100%;margin-top:12px" onclick="submitJob()">${t('submit')}</button></div>`}

function profileView(){
 const p=S.prof,cs=Object.keys(CITIES).concat(S.cities);
 const al=S.alerts.map((a,i)=>{const n=visible().filter(j=>j.c===a.c&&(!a.cat||j.cat===a.cat)&&(!a.ty||j.ty===a.ty)&&j.d<=3).length;
  return `<div class="card">🔔 ${esc(cityName(a.c))} · ${a.cat?CA[a.cat][L()]:t('allC')} · ${a.ty?TY[a.ty][L()]:t('allT')}<br><b>${n}</b> ${t('newA')} <button class="link" onclick="set(()=>S.alerts.splice(${i},1))">${t('remove')}</button></div>`}).join('');
 return `<h1>👤 ${t('prof')}</h1>
 <label class="f" for="u1">${t('name')}</label><input id="u1" value="${esc(p.name)}" autocomplete="name">
 <label class="f" for="u2">${t('phoneOrMail')}</label><input id="u2" value="${esc(p.contact)}" autocomplete="tel">
 <label class="f" for="u3">${t('skills')}</label><input id="u3" value="${esc(p.skills)}" placeholder="Typing, Malayalam, Excel…">
 <label class="f" for="u4">${t('about')}</label><textarea id="u4" rows="3">${esc(p.about)}</textarea>
 <div class="chips" role="group" aria-label="${t('free')}"><b style="width:100%">${t('free')}:</b>${['e','w','m'].map(k=>`<label><input type="checkbox" ${S.free.includes(k)?'checked':''} onchange="toggleFree('${k}',1)">${t(k)}</label>`).join('')}</div>
 <button class="p" style="width:100%" onclick="saveProfile()">${t('sv')}</button>
 <h2>🔔 ${t('alerts')}</h2>${al}
 <div class="row"><select id="a1">${cs.map(c=>`<option value="${esc(c)}">${esc(cityName(c))}</option>`).join('')}</select><select id="a2">${opts(CA,'',t('allC'),L())}</select><select id="a3">${opts(TY,'',t('allT'),L())}</select></div>
 <button onclick="addAlert()" style="width:100%">+ ${t('addA')}</button>
 <p class="mu">Alerts show here for now. Push/SMS alerts need the backend (see README comment).</p>
 <h2>🛡️ ${t('safeT')}</h2><div class="safe">• ${t('s1')}<br>• ${t('s2')}<br>• ${t('s3')}<br>• ${t('s4')}</div>`}

/* ---------- actions ---------- */
function apply(id){set(()=>{const r=S.tr[id];if(!r||r.st==='saved')S.tr[id]={st:'applied',rem:''}});toast(t('applied'))}
function toggleSave(id){set(()=>{if(S.tr[id])delete S.tr[id];else S.tr[id]={st:'saved',rem:''}})}
function reportJob(id){set(()=>S.reports.push(id));toast(t('reported'))} // real app: POST to reports table, auto-hide after N reports
function toggleFree(k,keep){const i=S.free.indexOf(k);i<0?S.free.push(k):S.free.splice(i,1);save();if(!keep)render()}
function setCity(v){if(v==='__add'){const n=(prompt(t('addCity'))||'').trim().slice(0,40);if(n&&!CITIES[n]&&!S.cities.includes(n))S.cities.push(n);if(n)S.city=n;save();render();return}set(()=>S.city=v)}
function locate(){if(!navigator.geolocation)return toast('Location not available');
 navigator.geolocation.getCurrentPosition(p=>{let b,m=1e9;for(const k in CITIES){const c=CITIES[k],d=(c.la-p.coords.latitude)**2+(c.lo-p.coords.longitude)**2;if(d<m){m=d;b=k}}set(()=>S.city=b)},()=>toast('Please allow location, or pick your city'))}
function submitJob(){const v=i=>$('#'+i).value.trim();
 if(!v('pt')||!/^\d{10}$/.test(v('pp')))return toast('Add a job title and 10-digit phone');
 const j={id:1000+Date.now()%1e6,t:v('pt').slice(0,60),e:v('pe').slice(0,40)||'Local employer',c:v('pc'),a:v('pa').slice(0,40)||'Nearby',cat:v('pk'),ty:v('py'),p:+v('pm')||0,u:v('pu'),h:v('ph').slice(0,30)||'Flexible',d:0,v:0,s:'f'+($('#pn').checked?'n':''),ph:v('pp'),km:1,req:v('pr').slice(0,200)||'Contact employer'};
 set(()=>{S.posted.push(j);S.city=j.c;S.updated=Date.now();S.tab='jobs'});toast(t('posted'));scrollTo(0,0)}
function saveProfile(){set(()=>S.prof={name:$('#u1').value,contact:$('#u2').value,skills:$('#u3').value,about:$('#u4').value});toast('✓')}
function addAlert(){set(()=>S.alerts.push({c:$('#a1').value,cat:$('#a2').value,ty:$('#a3').value}))}
function safety(){$('#modal').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${t('safeT')}"><div><h2>🛡️ ${t('safeT')}</h2><p>1. ${t('s1')}</p><p>2. ${t('s2')}</p><p>3. ${t('s3')}</p><p>4. ${t('s4')}</p><button class="p" style="width:100%" onclick="S.seen=true;save();$('#modal').innerHTML=''">${t('gotit')}</button></div></div>`}

function render(){
 document.documentElement.lang=S.lang;
 const v={jobs:jobsView,my:trackerView,post:postView,me:profileView}[S.tab]();
 const lang=`<div style="text-align:right"><select style="width:auto;min-height:36px;padding:2px 8px" aria-label="Language" onchange="set(()=>S.lang=this.value)"><option value="en" ${S.lang==='en'?'selected':''}>English</option><option value="ml" ${S.lang==='ml'?'selected':''}>മലയാളം</option></select> <b style="float:left;font-size:1.25rem;color:var(--pr)">WorkNear</b></div>`;
 const keep=document.activeElement&&document.activeElement.id;
 $('#main').innerHTML=lang+v;
 $('#nav').innerHTML=[['jobs','🔍','jobs'],['my','🔖','my'],['post','➕','post'],['me','👤','me']].map(x=>`<button onclick="go('${x[0]}')" ${S.tab===x[0]?'aria-current="page"':''}><span class="e" aria-hidden="true">${x[1]}</span>${t(x[2])}</button>`).join('');
}
render();if(!S.seen)safety();
</script></body></html>
